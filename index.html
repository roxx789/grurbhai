    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #0d1424;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .profile-img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 4px solid #f59e0b;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.5);
            object-fit: cover;
            margin-bottom: 15px;
        }
        h1 {
            color: #f59e0b;
            font-size: 20px;
            margin-bottom: 10px;
        }
        .sub-text {
            font-size: 14px;
            color: #d1d5db;
            line-height: 1.5;
            margin-bottom: 15px;
        }
        .badge-text {
            color: #38bdf8;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        .users-count {
            color: #9ca3af;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .info-box {
            background-color: #1a233a;
            border: 1px solid #2e3a59;
            color: #ffffff;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: default;
            pointer-events: none;
            user-select: none;
        }

        .cta-btn {
            background: linear-gradient(180deg, #f59e0b 0%, #d97706 100%);
            color: #ffffff;
            font-weight: bold;
            font-size: 16px;
            padding: 15px;
            width: 100%;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
            transition: all 0.2s ease;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .cta-btn:active {
            transform: scale(0.98);
        }

        .footer-text {
            margin-top: 20px;
            font-size: 14px;
            color: #9ca3af;
            letter-spacing: 0.3px;
        }
        .footer-text span {
            color: #38bdf8;
            font-weight: 600;
        }
    </style>

    <div class="container">

        <div class="users-count">👥 40k+ active members</div>

            <span class="text-center w-full">JOIN TELEGRAM CHANNEL</span>
            <i class="fa-paper-plane fa-solid text-white text-lg mr-1"></i>
        </button>

    </div>
